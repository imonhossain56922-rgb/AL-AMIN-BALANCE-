<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#101010" />
      <stop offset="100%" stop-color="#171717" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="45%" stop-color="#FFB52E" />
      <stop offset="100%" stop-color="#FF9F1C" />
    </linearGradient>
    <linearGradient id="dark-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#383838" />
      <stop offset="100%" stop-color="#1F1F1F" />
    </linearGradient>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />

  <!-- Outer sleek border -->
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="url(#dark-border)" stroke-width="3" />

  <!-- Outer concentric financial track -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#292929" stroke-width="4" stroke-dasharray="8 6" />

  <!-- Accent arc -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#gold-grad)" stroke-width="6" stroke-dasharray="140 380" stroke-linecap="round" />

  <!-- Inner circle -->
  <circle cx="256" cy="256" r="132" fill="#141414" stroke="#292929" stroke-width="2" />

  <!-- Central "AB" Monogram Logo -->
  <g filter="url(#gold-glow)" transform="translate(146, 170)">
    <!-- Letter A -->
    <path d="M 50 160 L 95 30 L 125 30 L 170 160 L 138 160 L 124 116 L 86 116 L 76 160 Z M 94 88 L 118 88 L 106 48 Z" fill="url(#gold-grad)" />
    <!-- Letter B overlap -->
    <path d="M 150 30 L 195 30 C 218 30 230 42 230 60 C 230 74 220 86 206 90 C 224 94 235 108 235 128 C 235 148 218 160 195 160 L 150 160 Z M 178 54 L 178 82 L 194 82 C 204 82 210 76 210 68 C 210 60 204 54 194 54 Z M 178 106 L 178 136 L 196 136 C 206 136 213 130 213 121 C 213 112 206 106 196 106 Z" fill="#FFFFFF" fill-opacity="0.95" />
  </g>
</svg>
